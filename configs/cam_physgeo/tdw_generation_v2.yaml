    purpose: Mild camera motions for LingBot-Fast camera-conditioned warmup.
    allowed_variants:
      - orbit_left_12
      - orbit_right_12
      - strafe_left_025
      - strafe_right_025
      - dolly_in_010
      - dolly_out_010
    banned_keywords:
      - lookaway
      - offscreen
      - relative_yaw_180
      - relative_lookaway
      - reobserve
      - occluder
      - extreme
    upstream_mapping:
      orbit_left_12:
        motion: orbit
        orbit: -12.0
        height: 0.02
        radius: 0.0
        strafe: 0.0
        require_reobserve: false
