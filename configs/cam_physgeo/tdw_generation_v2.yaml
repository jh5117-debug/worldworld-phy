# Physion-style TDW moving-camera generation v2 config.
# Physion is TDW/ThreeDWorld simulation; this is not real-world video data.
existing_moving_camera_workspace: /home/nvme03/workspace/physion_moving_camera_mainline_20260505
output_root: local_assets/data/physion/generated_v2
seed_start: 22000
display: ":8"
tdw_display:
  display: ":8"
  gpu_index: 0
display_gpu_map:
  ":8": 0
allowed_gpu_indices: [6, 7]
default_templates: [drop, collision, roll, containment]
resolution:
  width: 832
  height: 480
frames:
  max_frames: 81
  min_frames: 81
  aligned_frames: 81
output:
  require_rgb: true
  require_depth: true
  require_id: true
  require_camera_pose: true
  require_intrinsics: true
  require_object_state: true
camera_sets:
